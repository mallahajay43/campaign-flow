spring:
  application:
    name: campaignflow

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/campaignflow}
    username: ${DB_USERNAME:campaignflow}
    password: ${DB_PASSWORD:campaignflow}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false

  kafka:
    listener:
      ack-mode: manual
    bootstrap-servers: ${KAFKA_BROKERS:localhost:29092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retries: 3
        spring.json.add.type.headers: false
    consumer:
      group-id: campaignflow-monolith
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "me.mallahajay43.campaignflow.*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.LinkedHashMap

  flyway:
    enabled: true

  threads:
    virtual:
      enabled: true

  modulith:
    runtime:
      verification-enabled: true

  http:
    multipart:
      enabled: true
      location: /upload

  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false
    time-zone: ${TIMEZONE:Asia/Kolkata}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

  api-docs:
    path: /v1/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith
  endpoint:
    health:
      show-details: when_authorized

app:
  jwt:
    secret-key: ${JWT_SECRET_KEY:+C1jhXRswjloO8ab7IWWp9HrjqH16ZFCWFX7TGC1EhE=}
    refreshExpirationHr: 24
    refreshTokenDurationMs: 10

  kafka:
    topics:
      contact_import_requested: contact.import.requested
      campaign_started: campaign.started
      email_send: email.send

  minio:
    endpoint: http://localhost:9000
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: campaign-flow

  contact-import:
    batch-size: 500
    lease-duration: 45s